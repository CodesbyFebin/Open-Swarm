router:
  # Heuristics for task routing
  strategy: hybrid
  default_local: true
  enable_rate_limit_awareness: true
  max_retries: 3
  fallback_on_429: true
  
  # Purpose mapping
  purpose_mapping:
    exploration: fast
    coding: coding
    architecture: reasoning
    testing: critique
    optimization: reasoning
    documentation: fast

  # Complexity thresholds
  complexity:
    low:
      max_tokens: 1000
      preferred_purpose: fast
    medium:
      max_tokens: 4000
      preferred_purpose: coding
    high:
      max_tokens: 8000
      preferred_purpose: reasoning
